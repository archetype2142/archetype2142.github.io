        function initCV() {
            try {
                // Initialize Dark Mode
                const darkModeToggle = document.getElementById('dark-mode-toggle');
                if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }

                darkModeToggle.addEventListener('click', () => {
                    document.documentElement.classList.toggle('dark');
                    if (document.documentElement.classList.contains('dark')) {
                        localStorage.theme = 'dark';
                    } else {
                        localStorage.theme = 'light';
                    }
                });

                renderCV(CV_DATA);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
            } catch (error) {
                console.error('Error rendering CV data:', error);
                document.getElementById('loading').innerHTML = '<p class="text-red-600">Failed to render CV data.</p>';
            }
        }

          Object.entries(categories).forEach(([category, skills]) => {
              const catDiv = document.createElement('div');
              catDiv.className = 'w-full mb-3';
              catDiv.innerHTML = `
                  <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">${category}</div>
                  <div class="flex flex-wrap -m-0.5">
                      ${skills.map(skill => `<span class="skill-badge">${skill}</span>`).join('')}
                  </div>
              `;
              skillsContainer.appendChild(catDiv);
          });

          // Education
          const educationContainer = document.getElementById('courses-list');
          educationContainer.innerHTML = '';
          data.skills.education.forEach(edu => {
              const div = document.createElement('div');
              div.className = 'mb-2';
              div.innerHTML = `
                  <div class="flex justify-between items-baseline">
                      <h3 class="text-sm font-bold text-gray-900">${edu.school}</h3>
                      <span class="text-xs font-bold text-blue-600">${edu.year}</span>
                  </div>
                  <p class="text-xs text-gray-600 mb-1">${edu.degree}</p>
              `;
              
              // Add courses specifically under this education entry
              if (data.skills.courses) {
                  const coursesDiv = document.createElement('div');
                  coursesDiv.className = 'mt-1 space-y-0.5';
                  data.skills.courses.forEach(course => {
                      const p = document.createElement('p');
                      p.className = 'text-[11px] text-gray-500 flex justify-between leading-tight';
                      p.innerHTML = `<span>• ${course.name}</span> <span class="text-gray-400 opacity-75">${course.id || ''}</span>`;
                      coursesDiv.appendChild(p);
                  });
                  div.appendChild(coursesDiv);
              }
              
              educationContainer.appendChild(div);
          });

          // Languages
          const languagesContainer = document.getElementById('languages-list');
          data.skills.languages.forEach(lang => {
              const p = document.createElement('p');
              p.innerHTML = `<span class="font-semibold">${lang.name}</span>: ${lang.level}`;
              languagesContainer.appendChild(p);
          });

          // Work Experience
          const experienceContainer = document.getElementById('experience-list');
          data.work_experience.forEach(exp => {
              const div = document.createElement('div');
              div.className = 'relative';
              
              let content = `
                  <div class="mb-1 flex flex-col sm:flex-row sm:justify-between sm:items-baseline">
                      <h3 class="text-lg font-bold text-gray-900">${exp.company_url ? `<a href="${exp.company_url}" class="hover:text-blue-600 transition-colors">` : ''}${exp.company}${exp.company_url ? '</a>' : ''} <span class="text-sm font-normal text-gray-500 ml-1">| ${exp.role}</span></h3>
                      <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded uppercase tracking-wider">${exp.period}</span>
                  </div>
                  <div class="text-xs text-gray-500 mb-2 italic">${exp.location}</div>
                  ${exp.description ? `<p class="text-sm text-gray-600 mb-2 leading-relaxed">${exp.description}</p>` : ''}
              `;

              if (exp.projects) {
                  exp.projects.forEach(project => {
                      content += `
                          <div class="mt-3 ml-2 border-l-2 border-gray-100 pl-3">
                              <h4 class="text-sm font-bold text-gray-800">${project.url ? `<a href="${project.url}" class="hover:text-blue-600">` : ''}${project.name}${project.url ? '</a>' : ''} <span class="text-xs font-normal text-gray-500">[${project.role}]</span></h4>
                              <p class="text-xs text-gray-500 mb-1 italic">${project.description}</p>
                              <ul class="list-disc list-outside ml-4 text-xs text-gray-600 space-y-0.5 mb-1">
                                  ${project.highlights.map(h => `<li>${h}</li>`).join('')}
                              </ul>
                              ${project.technologies ? `<p class="text-[10px] font-bold text-gray-400 uppercase tracking-tighter">Tools: ${project.technologies.join(', ')}</p>` : ''}
                          </div>
                      `;
                  });
              } else if (exp.highlights) {
                  content += `
                      <ul class="list-disc list-outside ml-6 text-sm text-gray-600 space-y-0.5 mb-2">
                          ${exp.highlights.map(h => `<li>${h}</li>`).join('')}
                      </ul>
                  `;
              }

              if (exp.technologies) {
                  content += `<p class="text-[10px] font-bold text-gray-400 mt-1 uppercase tracking-tighter">Stack: ${exp.technologies.join(', ')}</p>`;
              }

              div.innerHTML = content;
              experienceContainer.appendChild(div);
          });

          // Personal Projects
          const projectsContainer = document.getElementById('projects-list');
          data.personal_projects.forEach(project => {
              const div = document.createElement('div');
              div.className = 'group';
              
              let content = `
                  <div class="flex items-baseline justify-between mb-1">
                      <h3 class="text-sm font-bold text-gray-900 flex items-center">
                          ${project.url ? `<a href="${project.url}" class="hover:text-blue-600">` : ''}${project.name}${project.url ? '</a>' : ''}
                          ${project.github ? `<a href="${project.github}" class="ml-1.5 text-gray-400 hover:text-gray-600"><i class="fab fa-github text-xs"></i></a>` : ''}
                      </h3>
                  </div>
                  <p class="text-xs text-gray-600 mb-2">${project.description}</p>
              `;

              if (project.highlights) {
                  content += `
                      <ul class="list-disc list-outside ml-4 text-[11px] text-gray-500 space-y-0.5 mb-2">
                          ${project.highlights.map(h => `<li>${h}</li>`).join('')}
                      </ul>
                  `;
              }

              content += `<p class="text-[10px] font-bold text-gray-400 uppercase tracking-tighter">Tech: ${project.technologies.join(', ')}</p>`;

              div.innerHTML = content;
              projectsContainer.appendChild(div);
          });
        }

        initCV();
    </script>
</body>
</html>
