        function initCV() {

            }

                <span class="flex items-center"><i class="fas fa-map-marker-alt mr-2 text-blue-600 opacity-75"></i> ${contact.location}</span>
                <a href="${contact.github}" target="_blank" class="flex items-center hover:text-blue-600"><i class="fab fa-github mr-2 text-blue-600 opacity-75"></i> GitHub</a>

                "Cloud & DevOps": ["Kamal", "Docker", "Kubernetes", "AWS", "Azure", "GCP", "Linode (Bare Metal)"],
                "Specialized": ["AI Vision (YOLO)", "PCB Design (KiCad)", "3D Printing", "IoT", "Data Visualization"]
            };

                div.className = 'text-xs';
                div.innerHTML = `
                    <div class="font-bold text-gray-700 underline decoration-gray-200 underline-offset-2">${course.url ? `<a href="${course.url}" class="hover:text-blue-600 transition-colors">` : ''}${course.name}${course.url ? '</a>' : ''}</div>
                    ${course.id ? `<div class="text-[10px] text-gray-400 mt-0.5 uppercase tracking-wide">${course.id}</div>` : ''}
                `;
                coursesContainer.appendChild(div);
            });
        }

        initCV();
    </script>
</body>
</html>
